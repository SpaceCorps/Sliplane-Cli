name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  release:
    if: github.event_name == 'release'
    needs: test
    strategy:
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,       ext: "" }
          - { os: macos-latest,   target: x86_64-apple-darwin,        ext: "" }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  ext: "" }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     ext: ".exe" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: contains(matrix.target, 'linux')
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          name=sliplane-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/sliplane${{ matrix.ext }} README.md "$name/"
          if [[ "${{ matrix.ext }}" == ".exe" ]]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> $GITHUB_ENV
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> $GITHUB_ENV
          fi
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
