[package]
name = "sliplane"
version = "1.2.0"
edition = "2024"
rust-version = "1.89"
description = "CLI for the Sliplane API - manage servers, services, Postgres, buckets and more"
license = "MIT"
repository = "https://github.com/SpaceCorps/Sliplane-Cli"
readme = "README.md"

[[bin]]
name = "sliplane"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "color", "wrap_help"] }
clap_complete = "4.6"
ctrlc = { version = "3.5.2", features = ["termination"] }
getrandom = "0.4"
indexmap = { version = "2", features = ["serde"] }
rpassword = "7.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }

[target.'cfg(unix)'.dependencies]
# Already pulled in by ctrlc; this asks it for one thing: stopping ssh with SIGTERM, not SIGKILL, so it can restore the terminal.
nix = { version = "0.31", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
